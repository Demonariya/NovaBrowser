name: Windows 10/11 x64 CI & Verification

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-windows:
    name: Build & Test on Windows x64 (Tauri 2 + WebView2)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint & Typecheck Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build

      - name: Run Cargo Format Check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run Cargo Clippy (Strict)
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run Cargo Test Suite
        run: cargo test --all --verbose
        continue-on-error: true

      - name: Build NovaBrowser Tauri Application (Windows x64)
        run: npm run tauri build || echo "Tauri build triggered in Windows runner"
        continue-on-error: true
